<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: warm rounded square -->
  <rect width="512" height="512" rx="112" fill="#FDFBF7"/>

  <!-- Subtle ground line -->
  <line x1="64" y1="390" x2="448" y2="390" stroke="#E8E0D2" stroke-width="6" stroke-linecap="round"/>

  <!-- Walking figure (mid-stride, heading right) -->
  <!-- Head -->
  <circle cx="220" cy="118" r="46" fill="#C4612F"/>

  <!-- Body / torso -->
  <path d="M220 164 Q214 220 208 268" stroke="#C4612F" stroke-width="28" stroke-linecap="round" fill="none"/>

  <!-- Back leg (pushing off) -->
  <path d="M208 268 Q188 320 172 374 Q168 386 176 390" stroke="#C4612F" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Front leg (stepping forward) -->
  <path d="M208 268 Q232 320 252 372 Q256 384 264 390" stroke="#C4612F" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Back arm (swinging forward) -->
  <path d="M215 200 Q258 232 278 252" stroke="#C4612F" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Front arm (swinging back) -->
  <path d="M215 200 Q172 228 152 248" stroke="#C4612F" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Location pin ahead (destination) -->
  <!-- Pin drop shadow / glow -->
  <ellipse cx="378" cy="394" rx="24" ry="8" fill="#C4612F" opacity="0.15"/>
  <!-- Pin body -->
  <path d="M378 240 C378 240 334 290 334 330 C334 354 354 374 378 374 C402 374 422 354 422 330 C422 290 378 240 378 240 Z" fill="#C4612F"/>
  <!-- Pin inner circle -->
  <circle cx="378" cy="328" r="18" fill="#FDFBF7"/>
  <!-- Pin stem -->
  <line x1="378" y1="374" x2="378" y2="390" stroke="#C4612F" stroke-width="10" stroke-linecap="round"/>

  <!-- Dotted path trail (behind figure) -->
  <circle cx="110" cy="382" r="8" fill="#C4612F" opacity="0.30"/>
  <circle cx="76"  cy="374" r="6" fill="#C4612F" opacity="0.20"/>
  <circle cx="48"  cy="364" r="4" fill="#C4612F" opacity="0.12"/>
</svg>

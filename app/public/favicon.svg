<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&amp;family=Noto+Serif+JP:wght@500&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#FDFBF7"/>

  <!-- SANPO — italic bold, Playfair Display -->
  <text
    x="256" y="268"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="136"
    font-weight="700"
    fill="#2B2623"
    text-anchor="middle"
    letter-spacing="-2"
  >SANPO</text>

  <!-- Thin rule under the text -->
  <rect x="96" y="288" width="320" height="3" rx="1.5" fill="#C4612F"/>

  <!-- 散歩 — small subtitle -->
  <text
    x="256" y="338"
    font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif"
    font-size="44"
    font-weight="500"
    fill="#C4612F"
    text-anchor="middle"
    letter-spacing="8"
  >散歩</text>
</svg>
